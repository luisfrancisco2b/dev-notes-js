<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevNotes</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <!-- JS -->
    <script src="js/app.js" defer></script>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>DevNotes</h1>

        <!-- Search-Container -->
        <div id="search-container">
            <i class="bi bi-search"></i>

            <input type="text" id="search-input" placeholder="Pesquisar nota...">
        </div>

        <!-- Export Notes Button -->
        <button id="exports-notes">
            Exportar CSV <i class="bi bi-download"></i>
        </button>
    </header>

    <!-- Main -->
    <main>

        <!-- Add Note Container -->
        <div id="add-note-container">

            <input type="text" id="note-content" placeholder="O que deseja anotar?">

            <button class="add-note"><i class="bi bi-plus-lg"></i></button>

        </div>

        <!-- Notes Container -->
        <div id="notes-conatiner">

            <!-- Notes -->
            <div id="notes">
                <textarea placeholder="Adicione algum texto"></textarea>

                <i class="bi bi-pin"></i>
                <i class="bi bi-x-lg"></i>
                <i class="bi bi-file-earmark-plus"></i>
            </div>

        </div>

    </main>

</body>

</html>
